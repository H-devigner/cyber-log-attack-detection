input {
  file {
    path => "/usr/share/logstash/sample-logs/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }

  tcp {
    port => 5044
    codec => line
  }
}

filter {
  mutate {
    copy => { "message" => "raw_message" }
  }

  if [log][file][path] =~ /ssh\.log$/ or [path] =~ /ssh\.log$/ or [message] =~ /sshd\[/ {
    mutate {
      add_field => {
        "log_source" => "ssh"
        "[event][dataset]" => "ssh.auth"
      }
    }

    grok {
      match => {
        "message" => "%{SYSLOGTIMESTAMP:ssh_timestamp} %{HOSTNAME:host_name} sshd\[%{NUMBER:process_pid:int}\]: %{GREEDYDATA:ssh_message}"
      }
    }

    if [ssh_message] =~ /^Failed password/ {
      grok {
        match => {
          "ssh_message" => "Failed password for (invalid user )?%{DATA:user_name} from %{IP:source_ip} port %{NUMBER:source_port:int} ssh2"
        }
      }
      mutate {
        add_field => {
          "[event][action]" => "ssh_failed_password"
          "[labels][attack_category]" => "ssh_bruteforce"
        }
      }
    } else if [ssh_message] =~ /^Accepted password/ {
      grok {
        match => {
          "ssh_message" => "Accepted password for %{DATA:user_name} from %{IP:source_ip} port %{NUMBER:source_port:int} ssh2"
        }
      }
      mutate {
        add_field => {
          "[event][action]" => "ssh_success"
          "[labels][attack_category]" => "normal"
        }
      }
    } else if [ssh_message] =~ /session opened/ {
      mutate {
        add_field => {
          "[event][action]" => "ssh_session_opened"
          "[labels][attack_category]" => "normal"
        }
      }
    }
  } else if [log][file][path] =~ /web_access\.log$/ or [path] =~ /web_access\.log$/ or [message] =~ /HTTP\/1\.[01]"/ {
    mutate {
      add_field => {
        "log_source" => "web"
        "[event][dataset]" => "web.access"
      }
    }

    grok {
      match => {
        "message" => "%{IP:source_ip} %{DATA:http_ident} %{DATA:http_auth} \[%{HTTPDATE:http_timestamp}\] \"%{WORD:http_method} %{URIPATHPARAM:url_original} HTTP/%{NUMBER:http_version}\" %{NUMBER:http_status:int} %{NUMBER:http_bytes:int} \"%{DATA:http_referrer}\" \"%{DATA:user_agent_original}\""
      }
    }

    if [url_original] =~ /(?i)(union.*select|%27|or%201=1|sqlmap)/ or [user_agent_original] =~ /(?i)sqlmap/ {
      mutate {
        add_field => {
          "[event][action]" => "web_sql_injection_attempt"
          "[labels][attack_category]" => "web_sql_injection"
        }
      }
    } else if [url_original] =~ /(?i)(<script|%3cscript|onerror=|xss)/ {
      mutate {
        add_field => {
          "[event][action]" => "web_xss_attempt"
          "[labels][attack_category]" => "web_xss"
        }
      }
    } else if [url_original] =~ /(?i)(\.\.%2f|\.\.\/|etc\/passwd|wp-admin)/ {
      mutate {
        add_field => {
          "[event][action]" => "web_path_traversal_or_scan"
          "[labels][attack_category]" => "web_path_traversal"
        }
      }
    } else {
      mutate {
        add_field => {
          "[event][action]" => "web_request"
          "[labels][attack_category]" => "normal"
        }
      }
    }
  } else if [log][file][path] =~ /firewall\.log$/ or [path] =~ /firewall\.log$/ or [message] =~ / action=/ {
    mutate {
      add_field => {
        "log_source" => "firewall"
        "[event][dataset]" => "firewall.traffic"
      }
    }

    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:firewall_timestamp} %{HOSTNAME:host_name} %{GREEDYDATA:firewall_kv}"
      }
    }

    date {
      match => ["firewall_timestamp", "ISO8601"]
      target => "@timestamp"
    }

    kv {
      source => "firewall_kv"
      field_split => " "
      value_split => "="
      target => "firewall"
    }

    mutate {
      rename => {
        "[firewall][src]" => "source_ip"
        "[firewall][dst]" => "destination_ip"
        "[firewall][spt]" => "source_port"
        "[firewall][dpt]" => "destination_port"
        "[firewall][proto]" => "network_protocol"
      }
      convert => {
        "source_port" => "integer"
        "destination_port" => "integer"
      }
    }

    if [firewall][action] =~ /(?i)(DENY|DROP|BLOCK)/ {
      mutate {
        add_field => {
          "[event][action]" => "firewall_blocked_connection"
          "[labels][attack_category]" => "firewall_blocked"
        }
      }
    } else {
      mutate {
        add_field => {
          "[event][action]" => "firewall_allowed_connection"
          "[labels][attack_category]" => "normal"
        }
      }
    }
  } else {
    mutate {
      add_field => {
        "log_source" => "unknown"
        "[event][action]" => "unparsed_log"
        "[labels][attack_category]" => "unknown"
      }
    }
  }
}

output {
  stdout {
    codec => rubydebug
  }

  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "cyberlog-events-%{+YYYY.MM.dd}"
  }
}
